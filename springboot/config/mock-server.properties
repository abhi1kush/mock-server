# mock-server (Spring Boot) runtime config, loaded by start.sh.
# (Deliberately not named application.properties, so Spring Boot does not auto-load it
#  when the jar is run directly, where PORT env must keep working.)
#
# Port precedence (highest first):
#   1. CLI arg:  ./start.sh --server.port=9090
#   2. Env var:  PORT=9090 ./start.sh
#   3. This file (server.port below)
#   4. Built-in default 8080 (src/main/resources/application.properties)
#
# Change the port here and restart; no rebuild is needed.
server.port=8080
